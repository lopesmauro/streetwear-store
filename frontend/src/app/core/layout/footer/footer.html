<footer class="bg-ink text-white">
  <div class="page-width pt-12 pb-6">
    <div class="flex flex-wrap items-start justify-between gap-10 pb-10">
      <div>
        <a routerLink="/" class="brand" aria-label="forma — voltar ao início"
          >forma<span class="text-white/40">.</span></a
        >
        <p class="mt-3 text-xs text-white/50">Da rua. Do seu jeito.</p>
      </div>
      <div class="flex gap-14 text-xs sm:gap-24">
        <nav aria-label="Coleções" class="grid gap-3">
          <span class="mb-1 font-semibold">Encontre sua forma</span>
          @for (category of categories; track category) {
            <a
              routerLink="/produtos"
              [queryParams]="{ categoria: category }"
              class="text-white/55 hover:text-white"
              >{{ category }}</a
            >
          }
        </nav>
        <nav aria-label="Atalhos" class="grid content-start gap-3">
          <span class="mb-1 font-semibold">Por aqui</span>
          <a routerLink="/produtos" class="text-white/55 hover:text-white">Produtos</a>
          <a routerLink="/favoritos" class="text-white/55 hover:text-white">Favoritos</a>
          <button class="text-left text-white/55 hover:text-white" (click)="openHelp.emit()">
            Entrega e trocas
          </button>
        </nav>
      </div>
    </div>
    <div
      class="flex flex-wrap justify-between gap-3 border-t border-white/15 pt-6 text-[10px] text-white/45"
    >
      <p>© 2026 forma. Feito para ser você.</p>
      <span>BRASIL / BRL R$</span>
    </div>
  </div>
</footer>
